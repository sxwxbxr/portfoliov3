name: Live-Seite prüfen

# Crawlt packages.sweber.dev (Sitemap, interne und externe Links, Checkout-Links)
# und meldet kaputte Seiten. Nur manuell, braucht keine Secrets.
on:
  workflow_dispatch:
    inputs:
      origin:
        description: "Basis-URL"
        default: "https://packages.sweber.dev"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/site-check.mjs "${{ inputs.origin }}"

  demos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1.50.0 && npx playwright install --with-deps chromium
      - run: node scripts/demo-check.mjs "${{ inputs.origin }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
