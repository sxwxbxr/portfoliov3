name: Gebündeltes Deployment

# Vercel baut nicht mehr bei jedem Push (git.deploymentEnabled=false in vercel.json).
# Stattdessen löst dieser Workflow alle 2 Stunden einen einzigen Production-Deploy aus,
# aber nur, wenn main seit dem letzten Deploy Änderungen hat, die die Seite betreffen
# (nicht nur .github/, docs/ oder Markdown im Hauptordner).
# Cron läuft in UTC (5, 9, 13, 17, 21 Uhr = 6-7 bis 22-23 Uhr Zürich). Eilige Änderungen:
# "Run workflow" mit force.
on:
  schedule:
    - cron: "0 5-21/4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Auch ohne neue Commits deployen"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deploy-batched
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prüfen, ob main sich geändert hat
        id: changed
        env:
          FORCE: ${{ inputs.force }}
        run: |
          head=$(git rev-parse HEAD)
          git fetch --tags --force origin
          last=$(git rev-parse -q --verify refs/tags/last-deployed || true)
          echo "sha=$head" >> "$GITHUB_OUTPUT"
          # Ohne Tag (erster Lauf) gilt alles als relevant.
          relevant=first-run
          if [ -n "$last" ]; then
            relevant=$(git diff --name-only "$last" "$head" | grep -vE '^(\.github/|docs/|[^/]+\.md$)' || true)
          fi
          if [ "$FORCE" = "true" ] || [ -n "$relevant" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Deploy nötig (letzter: ${last:-keiner}, jetzt: $head)"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Keine seitenrelevanten Änderungen seit dem letzten Deploy, übersprungen."
          fi

      - name: Vercel Deploy Hook auslösen
        if: steps.changed.outputs.deploy == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Secret VERCEL_DEPLOY_HOOK_URL fehlt (Repo-Settings > Secrets > Actions)."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$HOOK"

      - name: Deploy-Stand markieren
        if: steps.changed.outputs.deploy == 'true'
        run: |
          git tag -f last-deployed "${{ steps.changed.outputs.sha }}"
          git push -f origin refs/tags/last-deployed
